name: finenectar

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finenectar-app:latest
    container_name: finenectar_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/storage
      - public_data:/var/www/public
      - ./.env:/var/www/.env:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - finenectar_net

  webserver:
    image: nginx:alpine
    container_name: finenectar_webserver
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - public_data:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - finenectar_net

  db:
    image: mysql:8.0
    container_name: finenectar_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-finenectar}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootsecretpassword}
    volumes:
      - db_data:/var/lib/mysql
      - ./fine.sql:/docker-entrypoint-initdb.d/01_fine.sql:ro
    networks:
      - finenectar_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecretpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: finenectar_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - finenectar_net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: finenectar-app:latest
    container_name: finenectar_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/storage
      - ./.env:/var/www/.env:ro
    depends_on:
      - app
      - db
      - redis
    networks:
      - finenectar_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: finenectar-app:latest
    container_name: finenectar_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/storage
      - ./.env:/var/www/.env:ro
    depends_on:
      - app
      - db
      - redis
    networks:
      - finenectar_net

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  public_data:
    driver: local

networks:
  finenectar_net:
    driver: bridge
